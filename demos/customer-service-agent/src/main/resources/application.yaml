spring:
  application:
    name: customer-service-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_service}
    username: ${SPRING_DATASOURCE_USERNAME:customer_service}
    password: ${SPRING_DATASOURCE_PASSWORD:customer_service_dev_only}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ai:
    ollama:
      base-url: ${CUSTOMER_SERVICE_KNOWLEDGE_LLM_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${CUSTOMER_SERVICE_KNOWLEDGE_LLM_MODEL:qwen3:4b}
          temperature: ${CUSTOMER_SERVICE_KNOWLEDGE_LLM_TEMPERATURE:0}

server:
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: AI Company OS Customer Service Agent
    version: 0.2.0-SNAPSHOT

customer-service:
  knowledge:
    semantic:
      # Used only when the explicit `semantic` Spring profile is active.
      # The application rejects non-loopback endpoints until a remote-provider ADR is approved.
      base-url: ${CUSTOMER_SERVICE_KNOWLEDGE_SEMANTIC_BASE_URL:http://localhost:11434}
      api-key: ${CUSTOMER_SERVICE_KNOWLEDGE_SEMANTIC_API_KEY:}
      model: ${CUSTOMER_SERVICE_KNOWLEDGE_SEMANTIC_MODEL:bge-m3}
      dimension: ${CUSTOMER_SERVICE_KNOWLEDGE_SEMANTIC_DIMENSION:1024}
      maximum-distance: ${CUSTOMER_SERVICE_KNOWLEDGE_SEMANTIC_MAXIMUM_DISTANCE:0.45}
      index-on-startup: ${CUSTOMER_SERVICE_KNOWLEDGE_SEMANTIC_INDEX_ON_STARTUP:false}
    llm:
      # Used only when the explicit `llm` Spring profile is active.
      # Like embeddings, the application rejects non-loopback endpoints.
      base-url: ${CUSTOMER_SERVICE_KNOWLEDGE_LLM_BASE_URL:http://localhost:11434}
      model: ${CUSTOMER_SERVICE_KNOWLEDGE_LLM_MODEL:qwen3:4b}
      maximum-tokens: ${CUSTOMER_SERVICE_KNOWLEDGE_LLM_MAXIMUM_TOKENS:400}
      temperature: ${CUSTOMER_SERVICE_KNOWLEDGE_LLM_TEMPERATURE:0}
